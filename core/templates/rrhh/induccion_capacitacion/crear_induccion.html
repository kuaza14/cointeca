{% extends 'base.html' %}

{% block content %}

<div class="max-w-4xl mx-auto space-y-4">

    <!-- BREADCRUMB & VOLVER -->
    <div class="flex items-center justify-between gap-3">
        <nav class="flex items-center gap-2 text-xs text-[#64748B] font-medium" aria-label="Breadcrumb">
            <a href="{% url 'dashboard' %}" class="hover:text-primary transition">Dashboard</a>
            <span>/</span>
            <a href="{% url 'rrhh' %}" class="hover:text-primary transition">RRHH</a>
            <span>/</span>
            <a href="{% url 'empleados' %}" class="hover:text-primary transition">Empleados</a>
            <span>/</span>
            <a href="{% url 'detalle_empleado' empleado.id %}" class="hover:text-primary transition">{{ empleado.nombre_completo }}</a>
            <span>/</span>
            <a href="{% url 'inducciones_empleado' empleado.id %}" class="hover:text-primary transition">Inducciones</a>
            <span>/</span>
            <span class="text-[#1F2937] font-semibold">Nueva</span>
        </nav>
        <a href="{% url 'inducciones_empleado' empleado.id %}" class="btn btn-secundario text-xs font-semibold px-3 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition">
            ← Volver a Inducciones
        </a>
    </div>

    <div class="bg-card shadow rounded-2xl border border-border p-6">
        <h1 class="text-2xl font-bold mb-6 text-[#1F2937] flex items-center gap-2">
            <span>🎓</span> <span>Nueva Inducción / Capacitación</span>
        </h1>

    <form method="POST">

        {% csrf_token %}

        <div class="grid grid-cols-2 gap-4">

            <div>
                <label class="block font-semibold mb-2" for="campo-fecha">
                    Fecha
                </label>

                <input id="campo-fecha"
                    type="date"
                    name="fecha"
                    required
                    class="w-full border rounded px-3 py-2"
                >
            </div>

            <div>
                <label class="block font-semibold mb-2" for="campo-tipo_evento">
                    Tipo de evento
                </label>

                <select id="campo-tipo_evento"
                    name="tipo_evento"
                    class="w-full border rounded px-3 py-2"
                >

                    <option value="INDUCCION">
                        Inducción
                    </option>

                    <option value="REINDUCCION">
                        Reinducción
                    </option>

                    <option value="CAPACITACION">
                        Capacitación específica
                    </option>

                </select>

            </div>

        </div>

        <hr class="my-6">

        <h2 class="text-xl font-bold mb-4">
            Capacitación técnica (si aplica)
        </h2>

        <div class="mb-4">

            <label class="block font-semibold mb-2" for="campo-tema_capacitacion">
                Tema
            </label>

            <input id="campo-tema_capacitacion"
                type="text"
                name="tema_capacitacion"
                class="w-full border rounded px-3 py-2"
            >

        </div>

        <div class="grid grid-cols-2 gap-4">

            <div>

                <label class="block font-semibold mb-2" for="campo-facilitador">
                    Facilitador
                </label>

                <input id="campo-facilitador"
                    type="text"
                    name="facilitador"
                    class="w-full border rounded px-3 py-2"
                >

            </div>

            <div>

                <label class="block font-semibold mb-2" for="campo-duracion_horas">
                    Duración (horas)
                </label>

                <input id="campo-duracion_horas"
                    type="number"
                    name="duracion_horas"
                    min="1"
                    class="w-full border rounded px-3 py-2"
                >

            </div>

        </div>

        <div class="mt-6 flex gap-3">

            <button
                type="submit"
                class="bg-success text-white px-4 py-2 rounded hover:bg-success-hover"
            >
                Guardar
            </button>

            <a href="{% url 'inducciones_empleado' empleado.id %}"
               class="bg-neutral text-white px-4 py-2 rounded hover:bg-neutral-hover">
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
