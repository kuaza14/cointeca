{% extends 'base.html' %}

{% block content %}

<div class="max-w-2xl mx-auto bg-card p-6 rounded shadow">

    <h1 class="text-2xl font-bold mb-6">Crear Indicador Estratégico</h1>

    <form method="POST" class="space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-semibold mb-1" for="campo-perspectiva">Perspectiva</label>
            <select id="campo-perspectiva" name="perspectiva" class="w-full border rounded px-3 py-2">
                <option value="financiera">Financiera</option>
                <option value="comercial">Comercial</option>
                <option value="operativa">Operativa</option>
                <option value="cliente">Cliente</option>
                <option value="aprendizaje">Aprendizaje</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-semibold mb-1" for="campo-nombre">Nombre del Indicador (KPI)</label>
            <input id="campo-nombre" type="text" name="nombre" required
                placeholder="Ej: Margen por Proyecto"
                class="w-full border rounded px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-1" for="campo-definicion">Definición Técnica</label>
            <textarea id="campo-definicion" name="definicion" required rows="3"
                placeholder="Ej: (Utilidad Bruta / Valor Contrato) * 100"
                class="w-full border rounded px-3 py-2"></textarea>
        </div>

        <div>
            <label class="block text-sm font-semibold mb-1" for="campo-meta_anual">Meta Anual</label>
            <input id="campo-meta_anual" type="text" name="meta_anual" required
                placeholder="Ej: > 25%"
                class="w-full border rounded px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-1" for="campo-frecuencia">Frecuencia de Medición</label>
            <select id="campo-frecuencia" name="frecuencia" class="w-full border rounded px-3 py-2">
                <option value="mensual">Mensual</option>
                <option value="trimestral">Trimestral</option>
                <option value="semestral">Semestral</option>
                <option value="anual">Anual</option>
                <option value="por_proyecto">Por Proyecto</option>
            </select>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit"
                class="bg-success text-white px-4 py-2 rounded hover:bg-success-hover">
                Guardar
            </button>
            <a href="/indicadores/"
                class="bg-neutral text-white px-4 py-2 rounded hover:bg-neutral-hover">
                Cancelar
            </a>
        </div>

    </form>
</div>

{% endblock %}
