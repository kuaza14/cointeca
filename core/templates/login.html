{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    <title>Cointeca | Iniciar Sesión</title>

</head>

<body class="bg-gray-100">

<div class="min-h-screen flex">

    <!-- ============================= -->
    <!-- LADO IZQUIERDO -->
    <!-- ============================= -->

    <div class="w-1/2 bg-white flex flex-col justify-center items-center text-blue-700 px-12">

        <img
            src="{% static 'img/logo-cointeca.png' %}"
            alt="Cointeca"
            class="max-h-20 w-auto object-contain mb-8">

        <p class="text-4xl mt-1 font-light">

            S.A.S.

        </p>

        

        <p class="text-2xl text-center leading-8 max-w-md">

            Sistema de Gestión Empresarial

        </p>

    </div>


    <!-- ============================= -->
    <!-- LADO DERECHO -->
    <!-- ============================= -->

    <div class="w-1/2 bg-white flex justify-center items-center">

        <div
        class="bg-white rounded-2xl w-full max-w-md p-10 border border-gray-200"
        style="box-shadow:0 25px 70px rgba(0,0,0,.30);">

            <h2 class="text-3xl font-bold text-center text-gray-700 mb-8">

                Iniciar Sesión

            </h2>

            {% if error %}

                <div class="bg-red-100 border border-red-300 text-red-700 rounded-lg p-3 mb-6">

                    {{ error }}

                </div>

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="mb-5">

                    <label class="block mb-2 text-gray-600 font-medium">

                        Usuario

                    </label>

                    <input
                        type="text"
                        name="username"
                        required
                        class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-600">

                </div>

                <div class="mb-8">

                    <label class="block mb-2 text-gray-600 font-medium">

                        Contraseña

                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                        class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-600">

                </div>

                <button
                    class="w-full bg-blue-700 hover:bg-blue-800 text-white py-3 rounded-lg font-semibold transition duration-200">

                    Ingresar

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
