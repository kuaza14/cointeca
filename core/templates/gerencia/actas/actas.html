{% extends 'base.html' %}

{% block content %}

<h1 class="text-3xl font-bold mb-6">Actas de Junta</h1>

<a href="/actas/crear/" 
   class="mb-4 inline-block bg-success text-white px-4 py-2 rounded hover:bg-success-hover">
   + Crear Acta
</a>
<a href="/dashboard/" class="mt-4 inline-block bg-neutral text-white px-4 py-2 rounded hover:bg-neutral-hover">
        Volver
</a>

<div class="overflow-x-auto">
<table class="min-w-full bg-card shadow rounded">
    <thead class="bg-neutral text-white">
        <tr>
            <th class="px-4 py-2">Número</th>
            <th class="px-4 py-2">Fecha</th>
            <th class="px-4 py-2">Estado</th>
            <th class="px-4 py-2 text-center">Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for a in actas %}
        <tr class="border-b hover:bg-muted">

            <td class="px-4 py-2">
                <a href="/actas/{{ a.id }}/" class="text-primary hover:underline">
                    {{ a.numero_acta }}
                </a>
            </td>

            <td class="px-4 py-2">{{ a.fecha }}</td>
            <td class="px-4 py-2">{{ a.estado }}</td>

        <!-- ACCIONES -->
        <td class="px-4 py-2 text-center space-x-2">

            <a href="/actas/{{ a.id }}/editar/" 
            class="inline-flex items-center justify-center w-8 h-8 bg-yellow-500 text-white rounded hover:bg-yellow-600"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z"/></svg><span class="sr-only">Editar</span></a>

            <a href="/actas/{{ a.id }}/eliminar/" 
            class="inline-flex items-center justify-center w-8 h-8 bg-destructive text-white rounded hover:bg-destructive-hover"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166M18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg><span class="sr-only">Eliminar</span></a>

        </td>

    </tr>

    {% endfor %}
</tbody>
</table>
</div>

{% endblock %}
