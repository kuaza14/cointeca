{% extends 'base.html' %}

{% block content %}


<div class="bg-card shadow rounded-lg p-6">

    <h1 class="text-3xl font-bold mb-6">
        Nuevo Compromiso Pago Daños a Terceros
    </h1>

    <form method="POST">

        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <div>

                <label class="font-semibold" for="campo-numero_acta">
                    Número de Acta
                </label>

                <input id="campo-numero_acta"
                    type="text"
                    name="numero_acta"
                    required
                    class="w-full border rounded px-3 py-2"
                >

            </div>

            <div>

                <label class="font-semibold" for="campo-fecha_evento">
                    Fecha del Evento
                </label>

                <input id="campo-fecha_evento"
                    type="date"
                    name="fecha_evento"
                    required
                    class="w-full border rounded px-3 py-2"
                >

            </div>

        </div>

        <div class="mt-4">

            <label class="font-semibold" for="campo-valor_descuento">
                Valor del Descuento
            </label>

            <input id="campo-valor_descuento"
                type="number"
                step="0.01"
                name="valor_descuento"
                required
                class="w-full border rounded px-3 py-2"
            >

        </div>

        <div class="mt-4">

            <label class="font-semibold" for="campo-descripcion_dano">
                Descripción del Daño
            </label>

            <textarea id="campo-descripcion_dano"
                name="descripcion_dano"
                rows="5"
                required
                class="w-full border rounded px-3 py-2"
            ></textarea>

        </div>

        <div class="mt-8 flex gap-3">

            <button
                type="submit"
                class="bg-success text-white px-5 py-2 rounded hover:bg-success-hover">
                Guardar
            </button>

            <a
                href="{% url 'compromisos_empleado' empleado.id %}"
                class="bg-neutral text-white px-5 py-2 rounded hover:bg-neutral-hover">
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
