{% extends 'base.html' %}

{% block content %}

<div class="mb-4 flex items-center justify-between gap-3">
    <nav class="flex items-center gap-2 text-xs text-[#64748B] font-medium" aria-label="Breadcrumb">
        <a href="{% url 'dashboard' %}" class="hover:text-primary transition">Dashboard</a>
        <span>/</span>
        <a href="{% url 'rrhh' %}" class="hover:text-primary transition">RRHH</a>
        <span>/</span>
        <a href="{% url 'empleados' %}" class="hover:text-primary transition">Empleados</a>
        <span>/</span>
        <a href="{% url 'detalle_empleado' empleado.id %}" class="hover:text-primary transition">{{ empleado.nombre_completo }}</a>
        <span>/</span>
        <a href="{% url 'retiros_cesantias_empleado' empleado.id %}" class="hover:text-primary transition">Cesantías</a>
        <span>/</span>
        <span class="text-[#1F2937] font-semibold">Nuevo</span>
    </nav>
    <a href="{% url 'retiros_cesantias_empleado' empleado.id %}" class="btn btn-secundario text-xs font-semibold px-3.5 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition shrink-0 shadow-2xs">
        ← Volver a Cesantías
    </a>
</div>

<h1 class="text-2xl font-bold mb-6">
    Crear retiro de cesantías
</h1>

<form method="POST">

    {% csrf_token %}

    <!-- Tipo de retiro -->
    <div class="mb-4">

        <label class="font-semibold" for="tipo_retiro">
            Tipo de retiro
        </label>

        <select
            name="tipo_retiro"
            id="tipo_retiro"
            class="border rounded p-2 w-full">

            <option value="">
                Seleccione
            </option>

            <option value="VIVIENDA">
                Vivienda
            </option>

            <option value="EDUCACION">
                Educación
            </option>

            <option value="DEFINITIVO">
                Retiro definitivo
            </option>

        </select>

    </div>


    <!-- CAMPOS GENERALES -->

    <div class="mb-4">

        <label class="font-semibold" for="campo-fondo_cesantias">
            Fondo de cesantías
        </label>

        <input id="campo-fondo_cesantias"
            type="text"
            name="fondo_cesantias"
            value="Protección"
            class="border rounded p-2 w-full">

    </div>


    <div class="mb-4">

        <label class="font-semibold" for="campo-fecha_solicitud">
            Fecha solicitud
        </label>

        <input id="campo-fecha_solicitud"
            type="date"
            name="fecha_solicitud"
            class="border rounded p-2 w-full">

    </div>


    <div class="mb-4">

        <label class="font-semibold" for="campo-valor_retiro">
            Valor retiro
        </label>

        <input id="campo-valor_retiro"
            type="number"
            name="valor_retiro"
            class="border rounded p-2 w-full">

    </div>


    <!-- VIVIENDA -->

    <div id="campos_vivienda" style="display:none;">

        <div class="mb-4">

            <label class="font-semibold" for="campo-direccion_vivienda">
                Dirección vivienda
            </label>

            <input id="campo-direccion_vivienda"
                type="text"
                name="direccion_vivienda"
                class="border rounded p-2 w-full">

        </div>


        <div class="mb-4">

            <label class="font-semibold" for="campo-descripcion_vivienda">
                Descripción vivienda
            </label>

            <textarea id="campo-descripcion_vivienda"
                name="descripcion_vivienda"
                class="border rounded p-2 w-full"></textarea>

        </div>

    </div>


    <!-- EDUCACIÓN -->

    <div id="campos_educacion" style="display:none;">

        <div class="mb-4">

            <label class="font-semibold" for="campo-institucion_educativa">
                Institución educativa
            </label>

            <input id="campo-institucion_educativa"
                type="text"
                name="institucion_educativa"
                class="border rounded p-2 w-full">

        </div>


        <div class="mb-4">

            <label class="font-semibold" for="campo-programa_estudio">
                Programa estudio
            </label>

            <input id="campo-programa_estudio"
                type="text"
                name="programa_estudio"
                class="border rounded p-2 w-full">

        </div>


        <div class="mb-4">

            <label class="font-semibold" for="campo-beneficiario">
                Beneficiario
            </label>

            <input id="campo-beneficiario"
                type="text"
                name="beneficiario"
                class="border rounded p-2 w-full">

        </div>

    </div>


    <!-- RETIRO DEFINITIVO -->

    <div id="campos_definitivo" style="display:none;">

        <div class="mb-4">

            <label class="font-semibold" for="campo-fecha_retiro_definitivo">
                Fecha retiro definitivo
            </label>

            <input id="campo-fecha_retiro_definitivo"
                type="date"
                name="fecha_retiro_definitivo"
                class="border rounded p-2 w-full">

        </div>

    </div>


    <!-- OBSERVACIONES -->

    <div class="mb-4">

        <label class="font-semibold" for="campo-observaciones">
            Observaciones
        </label>

        <textarea id="campo-observaciones"
            name="observaciones"
            class="border rounded p-2 w-full"></textarea>

    </div>


    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200">
        <a href="{% url 'retiros_cesantias_empleado' empleado.id %}"
           class="btn btn-secundario text-xs font-semibold px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition text-slate-600">
            Cancelar
        </a>
        <button
            type="submit"
            class="btn btn-primario bg-[#1E63F0] hover:bg-blue-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-xs transition">
            Guardar Retiro
        </button>
    </div>

</form>


<script>

const tipo = document.getElementById('tipo_retiro');

tipo.addEventListener('change', function(){

    document.getElementById('campos_vivienda').style.display = 'none';
    document.getElementById('campos_educacion').style.display = 'none';
    document.getElementById('campos_definitivo').style.display = 'none';

    if(this.value === 'VIVIENDA'){
        document.getElementById('campos_vivienda').style.display = 'block';
    }

    if(this.value === 'EDUCACION'){
        document.getElementById('campos_educacion').style.display = 'block';
    }

    if(this.value === 'DEFINITIVO'){
        document.getElementById('campos_definitivo').style.display = 'block';
    }

});

</script>

{% endblock %}
