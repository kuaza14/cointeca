{% extends 'base.html' %}

{% block content %}

<div class="max-w-4xl mx-auto bg-card shadow rounded-lg p-6">

    <h1 class="text-3xl font-bold mb-6 text-primary">
        Editar Retiro de Cesantías
    </h1>

    <form method="POST">

        {% csrf_token %}

        <!-- Tipo -->
        <div class="mb-4">

            <label class="font-semibold block mb-2" for="tipo_retiro">
                Tipo de retiro
            </label>

            <select
                name="tipo_retiro"
                id="tipo_retiro"
                class="border rounded w-full p-2"
            >

                <option value="VIVIENDA"
                    {% if retiro.tipo_retiro == 'VIVIENDA' %}selected{% endif %}>
                    Vivienda
                </option>

                <option value="EDUCACION"
                    {% if retiro.tipo_retiro == 'EDUCACION' %}selected{% endif %}>
                    Educación
                </option>

                <option value="DEFINITIVO"
                    {% if retiro.tipo_retiro == 'DEFINITIVO' %}selected{% endif %}>
                    Retiro definitivo
                </option>

            </select>

        </div>

        <!-- Fondo -->
        <div class="mb-4">

            <label class="font-semibold block mb-2" for="campo-fondo_cesantias">
                Fondo de cesantías
            </label>

            <input id="campo-fondo_cesantias"
                type="text"
                name="fondo_cesantias"
                value="{{ retiro.fondo_cesantias }}"
                class="border rounded w-full p-2"
            >

        </div>

        <!-- Fecha solicitud -->
        <div class="mb-4">

            <label class="font-semibold block mb-2" for="campo-fecha_solicitud">
                Fecha solicitud
            </label>

            <input id="campo-fecha_solicitud"
                type="date"
                name="fecha_solicitud"
                value="{{ retiro.fecha_solicitud|date:'Y-m-d' }}"
                class="border rounded w-full p-2"
            >

        </div>

        <!-- Valor -->
        <div class="mb-4">

            <label class="font-semibold block mb-2" for="campo-valor_retiro">
                Valor retiro
            </label>

            <input id="campo-valor_retiro"
                type="number"
                step="0.01"
                name="valor_retiro"
                value="{{ retiro.valor_retiro }}"
                class="border rounded w-full p-2"
            >

        </div>

        <!-- VIVIENDA -->
        <div id="campos_vivienda">

            <h3 class="font-bold text-success mb-3">
                Información Vivienda
            </h3>

            <div class="mb-4">

                <label class="block mb-2" for="campo-direccion_vivienda">
                    Dirección vivienda
                </label>

                <input id="campo-direccion_vivienda"
                    type="text"
                    name="direccion_vivienda"
                    value="{{ retiro.direccion_vivienda }}"
                    class="border rounded w-full p-2"
                >

            </div>

            <div class="mb-4">

                <label class="block mb-2" for="campo-descripcion_vivienda">
                    Descripción vivienda
                </label>

                <textarea id="campo-descripcion_vivienda"
                    name="descripcion_vivienda"
                    class="border rounded w-full p-2"
                >{{ retiro.descripcion_vivienda }}</textarea>

            </div>

        </div>

        <!-- EDUCACION -->
        <div id="campos_educacion">

            <h3 class="font-bold text-primary mb-3">
                Información Educación
            </h3>

            <div class="mb-4">

                <label class="block mb-2" for="campo-institucion_educativa">
                    Institución educativa
                </label>

                <input id="campo-institucion_educativa"
                    type="text"
                    name="institucion_educativa"
                    value="{{ retiro.institucion_educativa }}"
                    class="border rounded w-full p-2"
                >

            </div>

            <div class="mb-4">

                <label class="block mb-2" for="campo-programa_estudio">
                    Programa estudio
                </label>

                <input id="campo-programa_estudio"
                    type="text"
                    name="programa_estudio"
                    value="{{ retiro.programa_estudio }}"
                    class="border rounded w-full p-2"
                >

            </div>

            <div class="mb-4">

                <label class="block mb-2" for="campo-beneficiario">
                    Beneficiario
                </label>

                <input id="campo-beneficiario"
                    type="text"
                    name="beneficiario"
                    value="{{ retiro.beneficiario }}"
                    class="border rounded w-full p-2"
                >

            </div>

        </div>

        <!-- DEFINITIVO -->
        <div id="campos_definitivo">

            <h3 class="font-bold text-destructive mb-3">
                Retiro Definitivo
            </h3>

            <div class="mb-4">

                <label class="block mb-2" for="campo-fecha_retiro_definitivo">
                    Fecha retiro definitivo
                </label>

                <input id="campo-fecha_retiro_definitivo"
                    type="date"
                    name="fecha_retiro_definitivo"
                    value="{{ retiro.fecha_retiro_definitivo|date:'Y-m-d' }}"
                    class="border rounded w-full p-2"
                >

            </div>

        </div>

        <!-- Observaciones -->
        <div class="mb-4">

            <label class="block mb-2" for="campo-observaciones">
                Observaciones
            </label>

            <textarea id="campo-observaciones"
                name="observaciones"
                class="border rounded w-full p-2"
            >{{ retiro.observaciones }}</textarea>

        </div>

        <div class="flex gap-3">

            <button
                type="submit"
                class="bg-primary text-white px-4 py-2 rounded hover:bg-primary-hover"
            >
                Guardar cambios
            </button>

            <a
                href="{% url 'retiros_cesantias_empleado' retiro.empleado.id %}"
                class="bg-neutral text-white px-4 py-2 rounded hover:bg-neutral-hover"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

<script>

function actualizarCampos() {

    let tipo = document.getElementById("tipo_retiro").value;

    document.getElementById("campos_vivienda").style.display = "none";
    document.getElementById("campos_educacion").style.display = "none";
    document.getElementById("campos_definitivo").style.display = "none";

    if(tipo === "VIVIENDA") {
        document.getElementById("campos_vivienda").style.display = "block";
    }

    if(tipo === "EDUCACION") {
        document.getElementById("campos_educacion").style.display = "block";
    }

    if(tipo === "DEFINITIVO") {
        document.getElementById("campos_definitivo").style.display = "block";
    }

}

document
    .getElementById("tipo_retiro")
    .addEventListener("change", actualizarCampos);

window.onload = actualizarCampos;

</script>

{% endblock %}
