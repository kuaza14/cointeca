{% extends 'base.html' %}

{% block content %}

<div class="max-w-2xl mx-auto bg-card p-6 rounded shadow">

    <h1 class="text-2xl font-bold mb-2">Registrar Seguimiento</h1>
    <p class="text-muted-foreground mb-6">Indicador: <strong>{{ indicador.nombre }}</strong></p>

    <form method="POST" class="space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-semibold mb-1" for="campo-fecha">Fecha</label>
            <input id="campo-fecha" type="date" name="fecha" required
                class="w-full border rounded px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-1" for="campo-valor_obtenido">Valor Obtenido</label>
            <input id="campo-valor_obtenido" type="text" name="valor_obtenido" required
                placeholder="Ej: 28%"
                class="w-full border rounded px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-1" for="campo-observaciones">Observaciones</label>
            <textarea id="campo-observaciones" name="observaciones" rows="3"
                placeholder="Ej: Superó la meta del mes"
                class="w-full border rounded px-3 py-2"></textarea>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit"
                class="bg-success text-white px-4 py-2 rounded hover:bg-success-hover">
                Guardar
            </button>
            <a href="/indicadores/{{ indicador.id }}/"
                class="bg-neutral text-white px-4 py-2 rounded hover:bg-neutral-hover">
                Cancelar
            </a>
        </div>

    </form>
</div>

{% endblock %}
