{% extends 'base.html' %}

{% block content %}

<div class="max-w-4xl mx-auto space-y-4">

    <!-- BREADCRUMB & VOLVER (ALINEADO A LA DERECHA) -->
    <div class="flex items-center justify-between gap-3 mb-4">
        <nav class="flex items-center gap-2 text-xs text-[#64748B] font-medium" aria-label="Breadcrumb">
            <a href="{% url 'dashboard' %}" class="hover:text-primary transition">Dashboard</a>
            <span>/</span>
            <a href="{% url 'rrhh' %}" class="hover:text-primary transition">RRHH</a>
            <span>/</span>
            <a href="{% url 'empleados' %}" class="hover:text-primary transition">Empleados</a>
            <span>/</span>
            <a href="{% url 'detalle_empleado' empleado.id %}" class="hover:text-primary transition">{{ empleado.nombre_completo }}</a>
            <span>/</span>
            <a href="{% url 'descargos_empleado' empleado.id %}" class="hover:text-primary transition">Descargos</a>
            <span>/</span>
            <span class="text-[#1F2937] font-semibold">Nueva Citación</span>
        </nav>
        <a href="{% url 'descargos_empleado' empleado.id %}" class="btn-volver"><span class="chev-volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></svg></span><span>Volver a Descargos</span></a>
    </div>

    <div class="bg-card shadow rounded-2xl border border-border p-6">
        <h1 class="text-2xl font-bold mb-6 text-[#1F2937] flex items-center gap-2">
            <span><svg class="size-4 inline-block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/></svg></span> <span>Citación a Descargos · {{ empleado.nombre_completo }}</span>
        </h1>

    <form method="POST">

        {% csrf_token %}

        <div class="grid grid-cols-2 gap-4">

            <div>
                <label class="block font-semibold mb-1" for="campo-fecha_diligencia">
                    Fecha de la diligencia
                </label>

                <input id="campo-fecha_diligencia"
                    type="date"
                    name="fecha_diligencia"
                    required
                    class="w-full border rounded px-3 py-2"
                >
            </div>

            <div>
                <label class="block font-semibold mb-1" for="campo-hora_diligencia">
                    Hora
                </label>

                <input id="campo-hora_diligencia"
                    type="time"
                    name="hora_diligencia"
                    required
                    class="w-full border rounded px-3 py-2"
                >
            </div>

            <div class="col-span-2">

                <label class="block font-semibold mb-1" for="campo-lugar_diligencia">
                    Lugar / Plataforma
                </label>

                <input id="campo-lugar_diligencia"
                    type="text"
                    name="lugar_diligencia"
                    value="Oficina de RRHH"
                    class="w-full border rounded px-3 py-2"
                >

            </div>

            <div class="col-span-2">

                <label class="block font-semibold mb-1" for="campo-descripcion_hechos">
                    Descripción de los hechos
                </label>

                <textarea id="campo-descripcion_hechos"
                    name="descripcion_hechos"
                    rows="4"
                    required
                    class="w-full border rounded px-3 py-2"
                ></textarea>

            </div>

            <div>

                <label class="block font-semibold mb-1" for="campo-clausula_contrato">
                    Cláusula del contrato
                </label>

                <input id="campo-clausula_contrato"
                    type="text"
                    name="clausula_contrato"
                    class="w-full border rounded px-3 py-2"
                >

            </div>

            <div>

                <label class="block font-semibold mb-1" for="campo-articulo_reglamento">
                    Artículo del reglamento
                </label>

                <input id="campo-articulo_reglamento"
                    type="text"
                    name="articulo_reglamento"
                    class="w-full border rounded px-3 py-2"
                >

            </div>

            <div class="col-span-2">

                <label class="block font-semibold mb-1" for="campo-norma_cst">
                    Norma Código Sustantivo del Trabajo
                </label>

                <input id="campo-norma_cst"
                    type="text"
                    name="norma_cst"
                    class="w-full border rounded px-3 py-2"
                >

            </div>

        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200">
            <a
                href="{% url 'descargos_empleado' empleado.id %}"
                class="btn btn-secundario text-xs font-semibold px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition text-slate-600"
            >
                Cancelar
            </a>
            <button
                type="submit"
                class="btn btn-primario bg-[#1E63F0] hover:bg-blue-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-xs transition"
            >
                Guardar Citación
            </button>
        </div>

    </form>

    </div>
</div>

{% endblock %}
