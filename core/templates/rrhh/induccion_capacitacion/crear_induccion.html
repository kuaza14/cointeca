{% extends 'base.html' %}

{% block content %}

<div class="max-w-4xl mx-auto space-y-4">

    <!-- BREADCRUMB & VOLVER -->
    <div class="flex items-center justify-between gap-3">
        <nav class="flex items-center gap-2 text-xs text-[#64748B] font-medium" aria-label="Breadcrumb">
            <a href="{% url 'dashboard' %}" class="hover:text-primary transition">Dashboard</a>
            <span>/</span>
            <a href="{% url 'rrhh' %}" class="hover:text-primary transition">RRHH</a>
            <span>/</span>
            <a href="{% url 'empleados' %}" class="hover:text-primary transition">Empleados</a>
            <span>/</span>
            <a href="{% url 'detalle_empleado' empleado.id %}" class="hover:text-primary transition">{{ empleado.nombre_completo }}</a>
            <span>/</span>
            <a href="{% url 'inducciones_empleado' empleado.id %}" class="hover:text-primary transition">Inducciones</a>
            <span>/</span>
            <span class="text-[#1F2937] font-semibold">Nueva</span>
        </nav>
        <a href="{% url 'inducciones_empleado' empleado.id %}" class="btn-volver"><span class="chev-volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></svg></span><span>Volver a Inducciones</span></a>
    </div>

    <div class="bg-card shadow rounded-2xl border border-border p-6">
        <h1 class="text-2xl font-bold mb-6 text-[#1F2937] flex items-center gap-2">
            <span><svg class="size-4 inline-block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5"/></svg></span> <span>Nueva Inducción / Capacitación</span>
        </h1>

    <form method="POST">

        {% csrf_token %}

        <div class="grid grid-cols-2 gap-4">

            <div>
                <label class="block font-semibold mb-2" for="campo-fecha">
                    Fecha
                </label>

                <input id="campo-fecha"
                    type="date"
                    name="fecha"
                    required
                    class="w-full border rounded px-3 py-2"
                >
            </div>

            <div>
                <label class="block font-semibold mb-2" for="campo-tipo_evento">
                    Tipo de evento
                </label>

                <select id="campo-tipo_evento"
                    name="tipo_evento"
                    class="w-full border rounded px-3 py-2"
                >

                    <option value="INDUCCION">
                        Inducción
                    </option>

                    <option value="REINDUCCION">
                        Reinducción
                    </option>

                    <option value="CAPACITACION">
                        Capacitación específica
                    </option>

                </select>

            </div>

        </div>

        <hr class="my-6">

        <h2 class="text-xl font-bold mb-4">
            Capacitación técnica (si aplica)
        </h2>

        <div class="mb-4">

            <label class="block font-semibold mb-2" for="campo-tema_capacitacion">
                Tema
            </label>

            <input id="campo-tema_capacitacion"
                type="text"
                name="tema_capacitacion"
                class="w-full border rounded px-3 py-2"
            >

        </div>

        <div class="grid grid-cols-2 gap-4">

            <div>

                <label class="block font-semibold mb-2" for="campo-facilitador">
                    Facilitador
                </label>

                <input id="campo-facilitador"
                    type="text"
                    name="facilitador"
                    class="w-full border rounded px-3 py-2"
                >

            </div>

            <div>

                <label class="block font-semibold mb-2" for="campo-duracion_horas">
                    Duración (horas)
                </label>

                <input id="campo-duracion_horas"
                    type="number"
                    name="duracion_horas"
                    min="1"
                    class="w-full border rounded px-3 py-2"
                >

            </div>

        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200">
            <a href="{% url 'inducciones_empleado' empleado.id %}"
               class="btn btn-secundario text-xs font-semibold px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition text-slate-600">
                Cancelar
            </a>
            <button
                type="submit"
                class="btn btn-primario bg-[#1E63F0] hover:bg-blue-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-xs transition">
                Guardar Inducción
            </button>
        </div>

    </form>

</div>

{% endblock %}
