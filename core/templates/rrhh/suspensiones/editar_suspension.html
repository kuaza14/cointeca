{% extends 'rrhh/empleados/base_empleado.html' %}

{% block empleado_content %}

<div class="max-w-3xl mx-auto bg-white rounded-xl shadow p-8">

    <h2 class="text-2xl font-bold mb-6">

        Editar Suspensión

    </h2>

    <form method="POST">
        
        {% csrf_token %}

        <div class="grid grid-cols-2 gap-6">

            <div>

                <label class="font-semibold">

                    Fecha inicio

                </label>

                <input type="date" name="fecha_inicio" value="{{ suspension.fecha_inicio|date:'Y-m-d' }}"
                    class="border rounded w-full p-2" required>

            </div>

            <div>

                <label class="font-semibold">

                    Fecha fin

                </label>

                <input type="date" name="fecha_fin" value="{{ suspension.fecha_fin|date:'Y-m-d' }}"
                    class="border rounded w-full p-2" required>

            </div>

        </div>

        <div class="mt-6">

            <label class="font-semibold">

                Observaciones

            </label>

            <textarea name="observaciones" rows="5"
                class="border rounded w-full p-2">{{ suspension.observaciones }}</textarea>

        </div>

        <div class="mt-8 flex justify-end gap-4">

            <a href="javascript:history.back()" class="bg-gray-300 px-4 py-2 rounded">

                Cancelar

            </a>

            <button class="bg-blue-600 text-white px-5 py-2 rounded">

                Actualizar

            </button>

        </div>

    </form>

</div>

{% endblock %}
