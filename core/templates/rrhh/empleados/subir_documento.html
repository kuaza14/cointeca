{% extends 'rrhh/empleados/base_empleado.html' %}

{% block empleado_content %}

<h1 class="text-3xl font-bold mb-6">
    Subir Documento
</h1>

<a
    href="/rrhh/empleados/{{ empleado.id }}/"
 class="btn-volver"><span class="chev-volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></svg></span><span>Volver</span></a>

<div class="bg-card shadow rounded p-6 mt-6 max-w-2xl">

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="mb-4">

            <label class="font-semibold block mb-2" for="campo-nombre">
                Nombre documento
            </label>

            <input id="campo-nombre"
                type="text"
                name="nombre"
                class="w-full border rounded p-2"
                placeholder="Ej: Contrato laboral"
                required
            >

        </div>

        <div class="mb-6">

            <label class="font-semibold block mb-2" for="campo-archivo">
                Archivo
            </label>

            <input id="campo-archivo"
                type="file"
                name="archivo"
                class="w-full border rounded p-2"
                required
            >

        </div>

        <button
            class="bg-success text-white px-5 py-2 rounded hover:bg-success-hover"
        >
            Guardar documento
        </button>

    </form>

</div>

{% endblock %}
