{% extends 'base.html' %}

{% block content %}

<div class="max-w-5xl mx-auto bg-card p-6 rounded shadow">

    <h1 class="text-2xl font-bold mb-6">
        Nueva suspensión disciplinaria
    </h1>

    <p class="mb-6">
        Empleado:
        <strong>{{ empleado.nombre_completo }}</strong>
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <div class="md:col-span-2">
                <label class="font-semibold" for="campo-motivo_suspension">Motivo de la suspensión</label>
                <textarea id="campo-motivo_suspension"
                    name="motivo_suspension"
                    rows="4"
                    required
                    class="w-full border p-2 rounded"
                ></textarea>
            </div>

            <div>
                <label class="font-semibold" for="campo-fecha_falta">Fecha de la falta</label>
                <input id="campo-fecha_falta"
                    type="date"
                    name="fecha_falta"
                    required
                    class="w-full border p-2 rounded"
                >
            </div>

            <div class="md:col-span-2">
                <label class="font-semibold" for="campo-articulos_infringidos">
                    Artículos infringidos
                </label>

                <textarea id="campo-articulos_infringidos"
                    name="articulos_infringidos"
                    rows="6"
                    required
                    placeholder="Ejemplo: Artículo 38, numeral 4: ..."
                    class="w-full border p-2 rounded"
                ></textarea>
            </div>

            <div>
                <label class="font-semibold" for="campo-fecha_inicio_suspension">Inicio de suspensión</label>
                <input id="campo-fecha_inicio_suspension"
                    type="date"
                    name="fecha_inicio_suspension"
                    required
                    class="w-full border p-2 rounded"
                >
            </div>

            <div>
                <label class="font-semibold" for="campo-fecha_fin_suspension">Fin de suspensión</label>
                <input id="campo-fecha_fin_suspension"
                    type="date"
                    name="fecha_fin_suspension"
                    required
                    class="w-full border p-2 rounded"
                >
            </div>

            <div>
                <label class="font-semibold" for="campo-fecha_reincorporacion">Fecha de reincorporación</label>
                <input id="campo-fecha_reincorporacion"
                    type="date"
                    name="fecha_reincorporacion"
                    required
                    class="w-full border p-2 rounded"
                >
            </div>

            <div class="md:col-span-2">
                <label class="font-semibold" for="campo-responsabilidad_pecuniaria">
                    Responsabilidad pecuniaria
                </label>

                <textarea id="campo-responsabilidad_pecuniaria"
                    name="responsabilidad_pecuniaria"
                    rows="4"
                    class="w-full border p-2 rounded"
                ></textarea>
            </div>

            <div class="md:col-span-2">
                <label class="font-semibold" for="campo-consecuencia_reincidencia">
                    Consecuencia por reincidencia
                </label>

                <textarea id="campo-consecuencia_reincidencia"
                    name="consecuencia_reincidencia"
                    rows="4"
                    class="w-full border p-2 rounded"
                ></textarea>
            </div>

        </div>

        <div class="flex gap-3 mt-6">
            <button
                type="submit"
                class="bg-primary text-white px-5 py-2 rounded"
            >
                Guardar suspensión
            </button>

            <a
                href="{% url 'detalle_empleado' empleado.id %}"
                class="bg-neutral text-white px-5 py-2 rounded"
            >
                Cancelar
            </a>
        </div>

    </form>

</div>

{% endblock %}
