{% extends 'base.html' %}

{% block content %}

<div class="mb-4 flex items-center justify-between gap-3">
    <nav class="flex items-center gap-2 text-xs text-[#64748B] font-medium" aria-label="Breadcrumb">
        <a href="{% url 'dashboard' %}" class="hover:text-primary transition">Dashboard</a>
        <span>/</span>
        <a href="{% url 'rrhh' %}" class="hover:text-primary transition">RRHH</a>
        <span>/</span>
        <a href="{% url 'empleados' %}" class="hover:text-primary transition">Empleados</a>
        <span>/</span>
        <a href="{% url 'detalle_empleado' citacion.empleado.id %}" class="hover:text-primary transition">{{ citacion.empleado.nombre_completo }}</a>
        <span>/</span>
        <a href="{% url 'descargos_empleado' citacion.empleado.id %}" class="hover:text-primary transition">Descargos</a>
        <span>/</span>
        <span class="text-[#1F2937] font-semibold">Editar Citación</span>
    </nav>
    <a href="{% url 'descargos_empleado' citacion.empleado.id %}" class="btn btn-secundario text-xs font-semibold px-3.5 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition shrink-0 shadow-2xs">
        ← Volver a Descargos
    </a>
</div>

<h1 class="text-2xl font-bold mb-6">
    Editar citación de descargo
</h1>

<form method="POST">

    {% csrf_token %}

    <div class="mb-4">
        <label for="campo-fecha_diligencia">Fecha de diligencia</label>

        <input id="campo-fecha_diligencia"
            type="date"
            name="fecha_diligencia"
            value="{{ citacion.fecha_diligencia|date:'Y-m-d' }}"
            class="border p-2 w-full"
            required
        >
    </div>

    <div class="mb-4">
        <label for="campo-hora_diligencia">Hora de diligencia</label>

        <input id="campo-hora_diligencia"
            type="time"
            name="hora_diligencia"
            value="{{ citacion.hora_diligencia|time:'H:i' }}"
            class="border p-2 w-full"
            required
        >
    </div>

    <div class="mb-4">
        <label for="campo-lugar_diligencia">Lugar de diligencia</label>

        <input id="campo-lugar_diligencia"
            type="text"
            name="lugar_diligencia"
            value="{{ citacion.lugar_diligencia }}"
            class="border p-2 w-full"
        >
    </div>

    <div class="mb-4">
        <label for="campo-descripcion_hechos">Descripción de los hechos</label>

        <textarea id="campo-descripcion_hechos"
            name="descripcion_hechos"
            class="border p-2 w-full"
            rows="5"
        >{{ citacion.descripcion_hechos }}</textarea>
    </div>

    <div class="mb-4">
        <label for="campo-clausula_contrato">Cláusula del contrato</label>

        <input id="campo-clausula_contrato"
            type="text"
            name="clausula_contrato"
            value="{{ citacion.clausula_contrato }}"
            class="border p-2 w-full"
        >
    </div>

    <div class="mb-4">
        <label for="campo-articulo_reglamento">Artículo del reglamento</label>

        <input id="campo-articulo_reglamento"
            type="text"
            name="articulo_reglamento"
            value="{{ citacion.articulo_reglamento }}"
            class="border p-2 w-full"
        >
    </div>

    <div class="mb-4">
        <label for="campo-norma_cst">Norma CST</label>

        <input id="campo-norma_cst"
            type="text"
            name="norma_cst"
            value="{{ citacion.norma_cst }}"
            class="border p-2 w-full"
        >
    </div>

    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200">
        <a href="{% url 'descargos_empleado' citacion.empleado.id %}"
           class="btn btn-secundario text-xs font-semibold px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition text-slate-600">
            Cancelar
        </a>
        <button
            type="submit"
            class="btn btn-primario bg-[#1E63F0] hover:bg-blue-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-xs transition">
            Guardar Cambios
        </button>
    </div>

</form>

{% endblock %}
