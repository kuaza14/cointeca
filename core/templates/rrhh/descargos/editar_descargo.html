{% extends 'base.html' %}

{% block content %}

<div class="mb-4 flex items-center justify-between gap-3">
    <nav class="flex items-center gap-2 text-xs text-[#64748B] font-medium" aria-label="Breadcrumb">
        <a href="{% url 'dashboard' %}" class="hover:text-primary transition">Dashboard</a>
        <span>/</span>
        <a href="{% url 'rrhh' %}" class="hover:text-primary transition">RRHH</a>
        <span>/</span>
        <a href="{% url 'empleados' %}" class="hover:text-primary transition">Empleados</a>
        <span>/</span>
        <a href="{% url 'detalle_empleado' descargo.empleado.id %}" class="hover:text-primary transition">{{ descargo.empleado.nombre_completo }}</a>
        <span>/</span>
        <a href="{% url 'descargos_empleado' descargo.empleado.id %}" class="hover:text-primary transition">Descargos</a>
        <span>/</span>
        <span class="text-[#1F2937] font-semibold">Editar Diligencia</span>
    </nav>
    <a href="{% url 'descargos_empleado' descargo.empleado.id %}" class="btn btn-secundario text-xs font-semibold px-3 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition">
        ← Volver a Descargos
    </a>
</div>

<h1 class="text-2xl font-bold mb-6">
    Editar diligencia de descargo
</h1>

<form method="POST">

    {% csrf_token %}

    <div class="mb-4">
        <label for="campo-testigo">Testigo</label>

        <input id="campo-testigo"
            type="text"
            name="testigo"
            value="{{ descargo.testigo }}"
            class="border p-2 w-full"
        >
    </div>

    <div class="mb-4">
        <label for="campo-fecha_hechos">Fecha de los hechos</label>

        <input id="campo-fecha_hechos"
            type="date"
            name="fecha_hechos"
            value="{{ descargo.fecha_hechos|date:'Y-m-d' }}"
            class="border p-2 w-full"
            required
        >
    </div>

    <div class="mb-4">
        <label for="campo-hora_inicio">Hora inicio</label>

        <input id="campo-hora_inicio"
            type="time"
            name="hora_inicio"
            value="{{ descargo.hora_inicio|time:'H:i' }}"
            class="border p-2 w-full"
            required
        >
    </div>

    <div class="mb-4">
        <label for="campo-hora_cierre">Hora cierre</label>

        <input id="campo-hora_cierre"
            type="time"
            name="hora_cierre"
            value="{{ descargo.hora_cierre|time:'H:i' }}"
            class="border p-2 w-full"
        >
    </div>

    <div class="mb-4">
        <label for="campo-descripcion_falta">Descripción de la falta</label>

        <textarea id="campo-descripcion_falta"
            name="descripcion_falta"
            rows="5"
            class="border p-2 w-full"
        >{{ descargo.descripcion_falta }}</textarea>
    </div>

    <div class="mb-4">
        <label for="campo-observaciones_finales">Observaciones finales</label>

        <textarea id="campo-observaciones_finales"
            name="observaciones_finales"
            rows="5"
            class="border p-2 w-full"
        >{{ descargo.observaciones_finales }}</textarea>
    </div>

    <div class="flex items-center gap-3">
        <button
            type="submit"
            class="bg-primary text-white px-4 py-2 rounded hover:bg-primary-hover font-semibold">
            Guardar cambios
        </button>
        <a href="{% url 'descargos_empleado' descargo.empleado.id %}"
           class="bg-neutral text-white px-4 py-2 rounded hover:bg-neutral-hover font-semibold">
            Cancelar
        </a>
    </div>

</form>

{% endblock %}
