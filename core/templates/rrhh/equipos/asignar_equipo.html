{% extends 'base.html' %}

{% block content %}

<h1 class="text-xl font-bold tracking-wide hover:text-gray-300 transition">
    Asignar Equipo
</h1>

<a href="/rrhh/empleados/{{ empleado.id }}/" class="btn-volver"><span class="chev-volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></svg></span><span>Volver</span></a>

<div class="bg-card shadow rounded p-6 max-w-2xl">

    <p class="mb-6">
        <strong>Empleado:</strong>
        {{ empleado.nombre_completo }}
    </p>

    {% if error %}
    <div class="bg-red-100 border border-red-400 text-destructive px-4 py-3 rounded mb-4">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="space-y-4">

        {% csrf_token %}

        <!-- EQUIPO INVENTARIO -->
        <div>
            <label class="font-semibold" for="campo-equipo_inventario">
                Equipo disponible
            </label>

            <select id="campo-equipo_inventario"
                name="equipo_inventario"
                class="w-full border rounded p-2"
                required
            >

                <option value="">
                    Seleccione un equipo
                </option>

                {% for e in equipos %}
                <option value="{{ e.id }}">
                    {{ e.equipo }} | {{ e.referencia }} | {{ e.serial }}
                </option>
                {% endfor %}

            </select>
        </div>

        <!-- FECHA -->
        <div>
            <label class="font-semibold" for="campo-fecha_entrega">
                Fecha entrega
            </label>

            <input id="campo-fecha_entrega"
                type="date"
                name="fecha_entrega"
                class="w-full border rounded p-2"
                required
            >
        </div>

        <!-- OBSERVACIONES -->
        <div>
            <label class="font-semibold" for="campo-observaciones">
                Observaciones
            </label>

            <textarea id="campo-observaciones"
                name="observaciones"
                class="w-full border rounded p-2"
            ></textarea>
        </div>

        <button class="bg-primary text-white px-5 py-2 rounded hover:bg-primary-hover">
            Guardar asignación
        </button>

    </form>

</div>

{% endblock %}
