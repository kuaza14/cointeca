services:
  db:
    image: postgres:18
    container_name: cointeca-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cointeca_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      # 5432 del host lo ocupa otro proyecto, por eso se expone en 5433
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cointeca_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: cointeca-web
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cointeca_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
    ports:
      # 8000 del host lo ocupa otro proyecto, por eso se expone en 8001
      - "${WEB_HOST_PORT:-8001}:8000"
    volumes:
      # el codigo montado permite recarga en caliente del runserver
      - .:/app
      # estas carpetas son de Windows: se enmascaran para no romper el contenedor
      - /app/venv
      - /app/node_modules
      # los archivos subidos sobreviven a la reconstruccion de la imagen
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  # Watcher de Tailwind. Solo se levanta si lo pides: docker compose --profile dev up
  tailwind:
    image: node:24-slim
    container_name: cointeca-tailwind
    working_dir: /app
    profiles: ["dev"]
    # --watch=always evita que el CLI se cierre al no haber stdin en el contenedor
    command: sh -c "npm install && npx @tailwindcss/cli -i ./static/css/input.css -o ./static/css/output.css --watch=always"
    volumes:
      - .:/app
      - /app/venv
      - node_modules:/app/node_modules

volumes:
  pgdata:
    # reutiliza el volumen que ya tiene las migraciones aplicadas
    name: cointeca_pg18
  media:
    name: cointeca_media
  node_modules:
    name: cointeca_node_modules
