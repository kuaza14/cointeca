{% extends 'rrhh/empleados/base_empleado.html' %}

{% block empleado_content %}

<div class="max-w-4xl mx-auto bg-white rounded-xl shadow p-8">

    <h2 class="text-2xl font-bold mb-6">

        Nuevo Contrato de Aprendizaje

    </h2>

    <form method="POST">

        {% csrf_token %}

        <div class="grid grid-cols-2 gap-6">

            <div>

                <label>Institución</label>

                <input
                    type="text"
                    name="institucion"
                    value="{{ contrato.institucion }}"
                    class="border rounded w-full p-2"
                    required>

            </div>

            <div>

                <label>Especialidad</label>

                <input type="text" name="especialidad" value="{{ contrato.especialidad }}" class="border rounded w-full p-2" required>

            </div>

            <div>

                <label>Número Grupo</label>

                <input type="text" name="numero_grupo" value="{{ contrato.numero_grupo }}" class="border rounded w-full p-2">

            </div>

            <div>

                <label>Modalidad</label>

                <select name="modalidad" value="{{ contrato.modalidad }}" class="border rounded w-full p-2">

                    <option value="Lectiva">

                        Lectiva

                    </option>

                    <option value="Productiva">

                        Productiva

                    </option>

                    <option value="Mixta">

                        Mixta

                    </option>

                </select>

            </div>

            <div>

                <label>Fecha Inicio Contrato</label>

                <input type="date" name="fecha_inicio" value="{{ contrato.fecha_inicio|date:'Y-m-d' }}" class="border rounded w-full p-2">

            </div>

            <div>

                <label>Fecha Fin Contrato</label>

                <input type="date" name="fecha_fin" value="{{ contrato.fecha_fin|date:'Y-m-d' }}" class="border rounded w-full p-2">

            </div>

            <div>

                <label>Inicio Etapa Lectiva</label>

                <input type="date" name="fecha_inicio_lectiva" value="{{ contrato.fecha_inicio_lectiva|date:'Y-m-d' }}" class="border rounded w-full p-2">

            </div>

            <div>

                <label>Fin Etapa Lectiva</label>

                <input type="date" name="fecha_fin_lectiva" value="{{ contrato.fecha_fin_lectiva|date:'Y-m-d' }}" class="border rounded w-full p-2">

            </div>

            <div>

                <label>Inicio Etapa Productiva</label>

                <input type="date" name="fecha_inicio_practica" value="{{ contrato.fecha_inicio_practica|date:'Y-m-d' }}" class="border rounded w-full p-2">

            </div>

            <div>

                <label>Fin Etapa Productiva</label>

                <input type="date" name="fecha_fin_practica" value="{{ contrato.fecha_fin_practica|date:'Y-m-d' }}" class="border rounded w-full p-2">

            </div>

            <div>

                <label>Porcentaje apoyo</label>

                <input type="number" name="porcentaje_apoyo" value="100" class="border rounded w-full p-2">

            </div>

        </div>

        <div class="mt-8 flex justify-end gap-4">

            <a href="javascript:history.back()" class="bg-gray-300 px-4 py-2 rounded">

                Cancelar

            </a>

            <button class="bg-blue-600 text-white px-5 py-2 rounded">

                Guardar

            </button>

        </div>

    </form>

</div>

{% endblock %}
