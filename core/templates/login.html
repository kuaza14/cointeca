{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cointeca | Iniciar sesión</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="bg-background text-foreground">

<div class="flex min-h-screen flex-col lg:flex-row">

    <!-- ==================================================================
         PRESENTACIÓN
         En movil se reduce a una franja superior; el formulario manda.
         ================================================================== -->
    <div class="flex flex-col items-center justify-center gap-4 bg-primary px-6 py-10 text-on-primary lg:w-1/2 lg:py-12">

        <img src="{% static 'img/logo-cointeca.png' %}"
             alt="Cointeca S.A.S"
             class="h-14 w-auto object-contain brightness-0 invert lg:h-20">

        <p class="text-center text-lg font-light lg:text-2xl">
            Sistema de Gestión Empresarial
        </p>
    </div>

    <!-- ==================================================================
         FORMULARIO
         ================================================================== -->
    <div class="flex flex-1 items-center justify-center px-4 py-10 lg:w-1/2">

        <div class="w-full max-w-md rounded-2xl border border-border bg-card p-6 shadow-lg sm:p-10">

            <h1 class="text-2xl font-bold text-primary">Iniciar sesión</h1>
            <p class="mt-1 text-sm text-muted-foreground">
                Ingresa con tus credenciales de Cointeca.
            </p>

            {% if error %}
                <div role="alert"
                     class="mt-6 rounded-lg border border-destructive/30 bg-destructive-soft px-4 py-3 text-sm font-medium text-destructive">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" class="mt-6 space-y-5">
                {% csrf_token %}

                <div>
                    <label for="username" class="mb-1.5 block text-sm font-medium">
                        Usuario
                    </label>
                    <input type="text"
                           id="username"
                           name="username"
                           required
                           autocomplete="username"
                           autofocus
                           {% if error %}aria-invalid="true"{% endif %}
                           class="min-h-11 w-full rounded-lg border border-border-strong bg-card px-4 py-3 transition-colors duration-150 hover:border-primary">
                </div>

                <div>
                    <label for="password" class="mb-1.5 block text-sm font-medium">
                        Contraseña
                    </label>
                    <input type="password"
                           id="password"
                           name="password"
                           required
                           autocomplete="current-password"
                           {% if error %}aria-invalid="true"{% endif %}
                           class="min-h-11 w-full rounded-lg border border-border-strong bg-card px-4 py-3 transition-colors duration-150 hover:border-primary">
                </div>

                <button type="submit"
                        class="min-h-11 w-full rounded-lg bg-primary px-4 py-3 font-semibold text-on-primary transition-colors duration-200 hover:bg-primary-hover">
                    Ingresar
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
