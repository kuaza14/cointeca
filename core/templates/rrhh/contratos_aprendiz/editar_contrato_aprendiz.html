{% extends 'rrhh/empleados/base_empleado.html' %}

{% block empleado_content %}

<div class="max-w-4xl mx-auto bg-card rounded-xl shadow p-8">

    <h2 class="text-2xl font-bold mb-6">

        Nuevo Contrato de Aprendizaje

    </h2>

    <form method="POST">

        {% csrf_token %}

        <div class="grid grid-cols-2 gap-6">

            <div>

                <label for="campo-institucion">Institución</label>

                <input id="campo-institucion"
                    type="text"
                    name="institucion"
                    value="{{ contrato.institucion }}"
                    class="border rounded w-full p-2"
                    required>

            </div>

            <div>

                <label for="campo-nit_institucion">NIT Institución</label>

                <input id="campo-nit_institucion" type="text"
                    name="nit_institucion"
                    value="{{ contrato.nit_institucion }}"
                    class="border rounded w-full p-2">

            </div>

            <div>

                <label for="campo-centro_formacion">Centro Formación</label>

                <input id="campo-centro_formacion" type="text"
                    name="centro_formacion"
                    value="{{ contrato.centro_formacion }}"
                    class="border rounded w-full p-2">
            </div>

            <div>

                <label for="campo-especialidad">Especialidad</label>

                <input id="campo-especialidad" type="text" name="especialidad" value="{{ contrato.especialidad }}" class="border rounded w-full p-2" required>

            </div>

            <div>

                <label for="campo-numero_grupo">Número Grupo</label>

                <input id="campo-numero_grupo" type="text" name="numero_grupo" value="{{ contrato.numero_grupo }}" class="border rounded w-full p-2">

            </div>

            <div>

                <label for="campo-modalidad">Modalidad</label>

                <select id="campo-modalidad" name="modalidad" value="{{ contrato.modalidad }}" class="border rounded w-full p-2">

                    <option value="Lectiva">

                        Lectiva

                    </option>

                    <option value="Productiva">

                        Productiva

                    </option>

                    <option value="Mixta">

                        Mixta

                    </option>

                </select>

            </div>

            <div>

                <label for="campo-fecha_inicio">Fecha Inicio Contrato</label>

                <input id="campo-fecha_inicio" type="date" name="fecha_inicio" value="{{ contrato.fecha_inicio|date:'Y-m-d' }}" class="border rounded w-full p-2">

            </div>

            <div>

                <label for="campo-fecha_fin">Fecha Fin Contrato</label>

                <input id="campo-fecha_fin" type="date" name="fecha_fin" value="{{ contrato.fecha_fin|date:'Y-m-d' }}" class="border rounded w-full p-2">

            </div>

            <div>

                <label for="campo-fecha_inicio_lectiva">Inicio Etapa Lectiva</label>

                <input id="campo-fecha_inicio_lectiva" type="date" name="fecha_inicio_lectiva" value="{{ contrato.fecha_inicio_lectiva|date:'Y-m-d' }}" class="border rounded w-full p-2">

            </div>

            <div>

                <label for="campo-fecha_fin_lectiva">Fin Etapa Lectiva</label>

                <input id="campo-fecha_fin_lectiva" type="date" name="fecha_fin_lectiva" value="{{ contrato.fecha_fin_lectiva|date:'Y-m-d' }}" class="border rounded w-full p-2">

            </div>

            <div>

                <label for="campo-fecha_inicio_practica">Inicio Etapa Productiva</label>

                <input id="campo-fecha_inicio_practica" type="date" name="fecha_inicio_practica" value="{{ contrato.fecha_inicio_practica|date:'Y-m-d' }}" class="border rounded w-full p-2">

            </div>

            <div>

                <label for="campo-fecha_fin_practica">Fin Etapa Productiva</label>

                <input id="campo-fecha_fin_practica" type="date" name="fecha_fin_practica" value="{{ contrato.fecha_fin_practica|date:'Y-m-d' }}" class="border rounded w-full p-2">

            </div>

            <div>

                <label for="campo-porcentaje_apoyo">Porcentaje apoyo</label>

                <input id="campo-porcentaje_apoyo" type="number" name="porcentaje_apoyo" value="100" class="border rounded w-full p-2">

            </div>

        </div>

        <div class="mt-8 flex justify-end gap-4">

            <a href="javascript:history.back()" class="bg-gray-300 px-4 py-2 rounded">

                Cancelar

            </a>

            <button class="bg-primary text-white px-5 py-2 rounded">

                Guardar

            </button>

        </div>

    </form>

</div>

{% endblock %}
