{% extends 'rrhh/empleados/base_empleado.html' %}
{% load static %}

{% block empleado_content %}

<h1 class="text-2xl font-bold mb-6">
    Agregar Elementos Entregados
</h1>

<div class="bg-card p-6 rounded shadow">

    <form method="POST">

        {% csrf_token %}

        <!-- TIPO PERSONAL -->
        <div class="mb-5">

            <label class="block font-bold mb-2" for="tipoPersonal">
                Tipo de personal
            </label>

            <select
                id="tipoPersonal"
                class="border p-2 rounded w-full"
            >
                <option value="">
                    Seleccione
                </option>

                <option value="terreno">
                    Personal de Terreno
                </option>

                <option value="administracion">
                    Administración
                </option>

            </select>

        </div>

        <!-- AGREGAR ELEMENTOS -->
        <div class="grid grid-cols-3 gap-3 mb-5">

            <!-- ELEMENTO -->
            <div>

                <label class="block font-bold mb-1" for="elemento">
                    Elemento
                </label>

                <select
                    id="elemento"
                    class="border p-2 rounded w-full"
                >
                    <option value="">
                        Seleccione un tipo primero
                    </option>
                </select>

            </div>

            <!-- DESCRIPCION -->
            <div>

                <label class="block font-bold mb-1" for="descripcion">
                    Descripción / Talla / Serial
                </label>

                <input
                    type="text"
                    id="descripcion"
                    class="border p-2 rounded w-full"
                    placeholder="Ej: Talla M"
                >

            </div>

            <!-- BOTON -->
            <div class="flex items-end">

                <button
                    type="button"
                    onclick="agregarElemento()"
                    class="bg-success text-white px-4 py-2 rounded hover:bg-success-hover w-full"
                ><svg class="size-4 inline-block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg> Agregar
                </button>

            </div>

        </div>

        <!-- TABLA -->
        <div class="overflow-x-auto">
<table class="w-full border">

            <thead class="bg-neutral text-white">

                <tr>
                    <th class="p-2">
                        Elemento
                    </th>

                    <th class="p-2">
                        Descripción / Serial
                    </th>

                    <th class="p-2 w-32">
                        Acción
                    </th>
                </tr>

            </thead>

            <tbody id="tablaElementos">

            </tbody>

        </table>
</div>

        <!-- FECHA -->
        <div class="mt-5">

            <label class="block font-bold mb-1" for="campo-fecha_entrega">
                Fecha entrega
            </label>

            <input id="campo-fecha_entrega"
                type="date"
                name="fecha_entrega"
                class="border p-2 rounded w-full"
                required
            >

        </div>

        <!-- BOTONES -->
        <div class="flex gap-2 mt-6">

            <button
                type="submit"
                class="bg-primary text-white px-4 py-2 rounded hover:bg-primary-hover"
            >
                Guardar Todo
            </button>

            <a
                href="/rrhh/empleados/{{ empleado.id }}/"
                class="bg-neutral text-white px-4 py-2 rounded hover:bg-neutral-hover"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>



{% endblock %}

{% block extra_js %}
<script src="{% static 'js/rrhh/empleado_agregar_dotacion.js' %}?v={% now 'U' %}"></script>
{% endblock %}
