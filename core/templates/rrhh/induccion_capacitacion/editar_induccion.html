{% extends 'base.html' %}

{% block content %}

<div class="max-w-4xl mx-auto space-y-4">

    <!-- BREADCRUMB & VOLVER -->
    <div class="flex items-center justify-between gap-3">
        <nav class="flex items-center gap-2 text-xs text-[#64748B] font-medium" aria-label="Breadcrumb">
            <a href="{% url 'dashboard' %}" class="hover:text-primary transition">Dashboard</a>
            <span>/</span>
            <a href="{% url 'rrhh' %}" class="hover:text-primary transition">RRHH</a>
            <span>/</span>
            <a href="{% url 'empleados' %}" class="hover:text-primary transition">Empleados</a>
            <span>/</span>
            <a href="{% url 'detalle_empleado' induccion.empleado.id %}" class="hover:text-primary transition">{{ induccion.empleado.nombre_completo }}</a>
            <span>/</span>
            <a href="{% url 'inducciones_empleado' induccion.empleado.id %}" class="hover:text-primary transition">Inducciones</a>
            <span>/</span>
            <span class="text-[#1F2937] font-semibold">Editar</span>
        </nav>
        <a href="{% url 'inducciones_empleado' induccion.empleado.id %}" class="btn btn-secundario text-xs font-semibold px-3.5 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition shrink-0 shadow-2xs">
            ← Volver a Inducciones
        </a>
    </div>

    <div class="bg-card shadow rounded-2xl border border-border p-6">
        <h1 class="text-2xl font-bold mb-6 text-[#1F2937] flex items-center gap-2">
            <span>✏️</span> <span>Editar Inducción / Capacitación</span>
        </h1>

        <form method="POST">

            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                <div>
                    <label class="font-semibold" for="campo-fecha">
                        Fecha
                    </label>

                    <input id="campo-fecha"
                        type="date"
                        name="fecha"
                        value="{{ induccion.fecha|date:'Y-m-d' }}"
                        class="w-full border rounded px-3 py-2"
                        required
                    >
                </div>

                <div>
                    <label class="font-semibold" for="campo-tipo_evento">
                        Tipo de evento
                    </label>

                    <select id="campo-tipo_evento"
                        name="tipo_evento"
                        class="w-full border rounded px-3 py-2"
                        required
                    >

                        <option value="INDUCCION"
                            {% if induccion.tipo_evento == 'INDUCCION' %}
                                selected
                            {% endif %}
                        >
                            Inducción
                        </option>

                        <option value="REINDUCCION"
                            {% if induccion.tipo_evento == 'REINDUCCION' %}
                                selected
                            {% endif %}
                        >
                            Reinducción
                        </option>

                        <option value="CAPACITACION"
                            {% if induccion.tipo_evento == 'CAPACITACION' %}
                                selected
                            {% endif %}
                        >
                            Capacitación específica
                        </option>

                    </select>
                </div>

            </div>

            <hr class="my-6">

            <h2 class="text-xl font-bold mb-4">
                Capacitación Técnica (si aplica)
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                <div>
                    <label class="font-semibold" for="campo-tema_capacitacion">
                        Tema
                    </label>

                    <input id="campo-tema_capacitacion"
                        type="text"
                        name="tema_capacitacion"
                        value="{{ induccion.tema_capacitacion }}"
                        class="w-full border rounded px-3 py-2"
                    >
                </div>

                <div>
                    <label class="font-semibold" for="campo-facilitador">
                        Facilitador
                    </label>

                    <input id="campo-facilitador"
                        type="text"
                        name="facilitador"
                        value="{{ induccion.facilitador }}"
                        class="w-full border rounded px-3 py-2"
                    >
                </div>

                <div>
                    <label class="font-semibold" for="campo-duracion_horas">
                        Duración (Horas)
                    </label>

                    <input id="campo-duracion_horas"
                        type="number"
                        name="duracion_horas"
                        value="{{ induccion.duracion_horas }}"
                        class="w-full border rounded px-3 py-2"
                    >
                </div>

            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200">
                <a
                    href="{% url 'inducciones_empleado' induccion.empleado.id %}"
                    class="btn btn-secundario text-xs font-semibold px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition text-slate-600"
                >
                    Cancelar
                </a>
                <button
                    type="submit"
                    class="btn btn-primario bg-[#1E63F0] hover:bg-blue-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-xs transition"
                >
                    Guardar Cambios
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
